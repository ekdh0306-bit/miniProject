{% extends "menu_layout.html" %}

{% block content %}
<div class="hero-container">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <div class="register-card" style="max-width: 650px;">
            <h2 class="register-title">회원 탈퇴</h2>

            <div style="margin-bottom: 25px; color: rgba(255, 255, 255, 0.75); line-height: 1.7;">
                <p>탈퇴한 계정은 복구할 수 없습니다.</p>
                <p>안전한 처리를 위해 현재 비밀번호를 다시 확인합니다.</p>
                <p>게시판, 분석 및 업로드 데이터는 이번 탈퇴 처리 범위에 포함되지 않습니다.</p>
            </div>

            {% if error %}
            <p style="margin-bottom: 20px; color: #ff8b8b; text-align: center;">{{ error }}</p>
            {% endif %}

            <form action="/member/delete" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="input-group">
                    <label for="delete-password">현재 비밀번호</label>
                    <input type="password" id="delete-password" name="password"
                           autocomplete="current-password" required>
                </div>

                <label style="display: flex; align-items: flex-start; gap: 10px; margin: 20px 0; color: rgba(255, 255, 255, 0.8);">
                    <input type="checkbox" name="confirm_delete" required style="margin-top: 5px;">
                    <span>계정을 복구할 수 없으며, 위 탈퇴 내용을 확인했습니다.</span>
                </label>

                <div class="button-group" style="display: flex; gap: 12px;">
                    <button type="submit" class="btn-delete"
                            style="flex: 1; min-height: 48px;">
                        회원 탈퇴
                    </button>
                    <a href="/mypage" class="hero-btn"
                       style="flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center;">
                        취소
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
