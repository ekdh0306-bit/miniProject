{% extends "menu_layout.html" %}

{% block content %}
<div class="hero-container">
    <div class="hero-overlay"></div>

    <div class="hero-content">
        <div class="register-card">
            <h2 class="register-title">
                <a href="/" style="text-decoration: none; color: inherit;">회원가입</a>
            </h2>

            <form action="/join" method="POST" class="register-form">
                <div class="input-group">
                    <label for="uid">아이디</label>
                    <input type="text" id="uid" name="uid" placeholder="아이디를 입력하세요" required>
                    <span id="uid-check-msg" style="font-size: 0.8rem; margin-top: 5px; display: none;"></span>
                </div>
                <div class="input-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                <div class="input-group">
                    <label for="username">이름</label>
                    <input type="text" id="username" name="username" placeholder="이름을 입력하세요" required>
                </div>
                <div class="input-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="pw" placeholder="비밀번호를 입력하세요" required>
                </div>
                <div class="input-group">
                    <label for="confirm_password">비밀번호 확인</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="비밀번호를 한 번 더 입력하세요"
                           required>
                </div>

                <button type="submit" class="hero-btn register-submit"
                        style="width: 100%; border: none; margin-top: 10px;">
                    가입하기
                </button>
            </form>

            <p class="login-link" style="margin-top: 20px; text-align: center; color: rgba(255,255,255,0.6);">
                이미 계정이 있으신가요? <a href="/login" style="color: white; font-weight: bold; text-decoration: none;">로그인</a>
            </p>
        </div>
    </div>
</div>

<script>

    const uidInput = document.getElementById('uid');
    const msgSpan = document.getElementById('uid-check-msg');
    const joinForm = document.querySelector('.register-form');
    let isUidValid = false; // 중복 확인 통과 여부 변수
    let uidCheckRequestId = 0;
    let validatedUid = '';

    uidInput.addEventListener('input', function () {
        isUidValid = false;
        validatedUid = '';
        uidCheckRequestId += 1;
        msgSpan.style.display = 'none';
    });

    async function checkUidAvailability() {
        const uid = uidInput.value.trim();
        if (!uid) {
            isUidValid = false;
            validatedUid = '';
            msgSpan.style.display = 'none';
            return false;
        }

        const requestId = ++uidCheckRequestId;
        isUidValid = false;
        validatedUid = '';

        try {
            const response = await fetch(`/check_uid?uid=${encodeURIComponent(uid)}`);
            const data = await response.json();

            // 입력값이 바뀌었거나 더 최신 요청이 있으면 이전 응답을 무시합니다.
            if (requestId !== uidCheckRequestId || uidInput.value.trim() !== uid) {
                return false;
            }

            msgSpan.style.display = 'block';
            if (!response.ok || data.error) {
                msgSpan.textContent = "⚠️ 아이디 확인에 실패했습니다. 잠시 후 다시 시도해 주세요.";
                msgSpan.style.color = "#ffb347";
            } else if (data.exists === true) {
                msgSpan.textContent = "❌ 이미 사용 중인 아이디입니다.";
                msgSpan.style.color = "#ff4d4d";
            } else if (data.exists === false) {
                msgSpan.textContent = "✅ 사용 가능한 아이디입니다.";
                msgSpan.style.color = "#00d1b2";
                isUidValid = true;
                validatedUid = uid;
                return true;
            } else {
                msgSpan.textContent = "⚠️ 아이디 확인에 실패했습니다. 잠시 후 다시 시도해 주세요.";
                msgSpan.style.color = "#ffb347";
            }
        } catch (err) {
            if (requestId !== uidCheckRequestId) {
                return false;
            }
            msgSpan.style.display = 'block';
            msgSpan.textContent = "⚠️ 아이디 확인에 실패했습니다. 잠시 후 다시 시도해 주세요.";
            msgSpan.style.color = "#ffb347";
            isUidValid = false;
        }
        return false;
    }

    // 아이디 입력창에서 포커스가 나갈 때 중복 확인을 미리 실행합니다.
    uidInput.addEventListener('blur', checkUidAvailability);

    // 중복 여부는 서버의 /join에서 최종 확인합니다. 프론트의 비동기
    // 확인 상태는 안내에만 사용하고 회원가입 제출 자체를 막지 않습니다.
    joinForm.addEventListener('submit', function (e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;

        if (password !== confirmPassword) {
            e.preventDefault();
            alert("비밀번호가 일치하지 않습니다.");
            document.getElementById('confirm_password').focus();
        }
    });

</script>
{% endblock %}
